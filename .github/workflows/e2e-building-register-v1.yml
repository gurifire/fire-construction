name: Building register E2E v1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium webkit
      - name: Run live-site check
        run: python e2e_building_register_v1.py
