name: Law API diagnostic v2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read repository files
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Diagnose law API access
        env:
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
        run: python3 law_api_diagnostic_v2.py
